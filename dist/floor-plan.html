<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floor Plan — The Olive Tree House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
  :root {
    --warm-white: #FAF8F3; --olive: #949A63; --deep-olive: #626842;
    --charcoal: #292A27; --soft-stone: #E8E4DA; --pale-olive: #E9EAD9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--warm-white); color: var(--charcoal);
    font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(250,248,243,0.94); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px;
  }
  header img.logo-small { height: 44px; width: auto; display: block; }
  .close-x {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--warm-white); border: 1px solid var(--soft-stone);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--charcoal); text-decoration: none; line-height: 1;
  }
  main { padding: 8px 22px 50px; max-width: 560px; margin: 0 auto; }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px; font-weight: 500; margin: 12px 0 6px;
  }
  .subtitle { font-size: 15px; color: var(--charcoal); margin-bottom: 20px; }
  .plan-wrap { position: relative; }
  .plan-img { display: block; width: 100%; height: auto; border-radius: 4px; border: 1px solid var(--soft-stone); }
  footer { margin-top: 40px; padding-top: 8px; text-align: center; }
  footer p { font-size: 12px; color: var(--deep-olive); }
  .branch-img{
    width:190px; aspect-ratio:732/259;
    background-image:url('assets/branch.png');
    background-size:contain; background-repeat:no-repeat; background-position:center;
    margin:0 auto 10px;
  }
</style>
</head>
<body>

<header>
  <img class="logo-small" src="assets/logo.png" alt="The Olive Tree House — Liapades, Corfu">
  <a class="close-x" href="the-house.html" aria-label="Close">×</a>
</header>

<main>
  <h1>Floor Plan</h1>
  <p class="subtitle">The Olive Tree House, Liapades, Corfu</p>
  <div class="plan-wrap">
    <img class="plan-img" src="assets/floor-plan.png" alt="Floor plan of The Olive Tree House, with north indicated to the right">
  </div>
</main>

<footer>
  <div class="branch-img" role="img" aria-label="Olive branch ornament"></div>
  <p>© 2026 The Olive Tree House</p>
</footer>

</body>
</html>
