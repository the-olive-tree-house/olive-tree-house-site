<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — The Olive Tree House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
  :root{
    --warm-white:#FAF8F3;
    --off-black:#292A27;
    --charcoal:#292A27;
    --olive:#949A63;
    --deep-olive:#626842;
    --pale-olive:#E9EAD9;
    --soft-stone:#E8E4DA;
    --muted:#6e6c62;
  }
  html,body{ color-scheme: light; min-height: 100dvh; }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--warm-white); color:var(--off-black);
    font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }

  header{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 22px; background:rgba(248,245,238,0.94);
    backdrop-filter:blur(6px); border-bottom:1px solid var(--soft-stone);
  }
  header img.logo-small { height: 44px; width: auto; display: block; }
  .close-x{ font-size:24px; line-height:1; color:var(--off-black); text-decoration:none; padding:4px 8px; }

  main{ max-width:520px; margin:0 auto; padding:20px 22px 40px; }

  nav.menu-list{ display:flex; flex-direction:column; }
  nav.menu-list a{
    font-family:'Cormorant Garamond', serif; font-weight:500;
    font-size:34px; color:var(--off-black); text-decoration:none;
    padding:14px 0; border-bottom:1px solid var(--soft-stone);
  }
  nav.menu-list a:first-child{ padding-top:4px; }

  a.submit-menu{
    display:block; width:100%; margin-top:30px; border:none; border-radius:3px;
    background:var(--olive); color:var(--warm-white); text-decoration:none;
    font-family:'Inter', sans-serif; font-size:12.5px; font-weight:600;
    letter-spacing:0.06em; text-transform:uppercase;
    padding:16px; text-align:center; cursor:pointer; box-sizing:border-box;
  }

  .branch-img{
    width:190px; aspect-ratio:732/259;
    background-image:url('assets/branch.png');
    background-size:contain; background-repeat:no-repeat; background-position:center;
    margin:0 auto;
  }

  footer{ margin-top:44px; padding:0 0 10px; text-align:center; }
  footer .branch-img{ margin-bottom:12px; }
  footer p{ font-size:12px; color:var(--deep-olive); margin:0; }
</style>
</head>
<body>

<header>
  <img class="logo-small" src="assets/logo.png" alt="The Olive Tree House — Liapades, Corfu">
  <a class="close-x" href="index.html" aria-label="Close">×</a>
</header>

<main>
  <nav class="menu-list">
    <a href="index.html">Home</a>
    <a href="the-house.html">The House</a>
    <a href="a-day-here.html">A Day Here</a>
    <a href="the-village.html">The Village</a>
    <a href="coastline.html">The Coastline</a>
    <a href="our-story.html">Our Story, Your Stories</a>
    <a href="faq.html">Frequently Asked Questions</a>
    <a href="contact.html">Contact Us</a>
  </nav>

  <a class="submit-menu" href="availability.html">Book Your Dates</a>

  <footer>
    <div class="branch-img" role="img" aria-label="Olive branch ornament"></div>
    <nav class="footer-links" aria-label="Policies">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="house-rules.html">House Rules</a>
      <a href="cancellation-policy.html">Cancellation Policy</a>
      <a href="contact.html">Contact</a>
    </nav>
    <p>© 2026 The Olive Tree House</p>
  </footer>
</main>

</body>
</html>
